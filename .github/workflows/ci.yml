name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Validation & Regression Suite (Python 3.13 on Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MGPS Empirical Bayes Engine Validation
        run: |
          python scripts/test_ebgm_engine.py

      - name: Run Version-Safe Join & Deduplication Tests
        run: |
          python scripts/test_version_safe_join.py

      - name: Validate Publication Tables 1-4 & Disproportionality Metrics
        run: |
          python scripts/validate_task_t1_02_publication_tables.py

      - name: Validate Publication Figures 1-3 & Small Multiples
        run: |
          python scripts/validate_task_t1_03_figures.py
